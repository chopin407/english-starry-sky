   server {
        listen       80;
        listen       [::]:80;
        listen       443 ssl http2;
        listen       [::]:443 ssl http2;

        server_name  eng.xaicloud.net;


        ssl_certificate /home/ubuntu/eng/eng.xaicloud.net.pem;
        ssl_certificate_key /home/ubuntu/eng/eng.xaicloud.net.key;

        ssl_session_timeout 5m;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        ssl_prefer_server_ciphers on;

	# 开启静态压缩（需预先生成 .gz 文件）
	    gzip_static on;
	        
	 # 动态压缩配置（若无静态压缩文件则动态压缩）
	    gzip on;
	    gzip_comp_level 6;          # 压缩级别（1-9，建议6）
	    gzip_min_length 100k;         # 仅压缩大于1KB的文件
	    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
	    gzip_vary on;               # 标识压缩响应头
	    gzip_buffers 16 8k;         # 压缩缓冲区设置
	    gzip_http_version 1.1;      # 最低HTTP版本

        

        location / {
            proxy_pass http://127.0.0.1:8091;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }


       
   }

